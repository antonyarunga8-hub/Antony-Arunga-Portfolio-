<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Antony Arunga Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #888;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            color: #667eea;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            background: white;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .tab:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .messages-container, .analytics-container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .message-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
        }

        .message-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .message-info h3 {
            color: #333;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .message-info .email {
            color: #667eea;
            font-size: 0.9rem;
        }

        .message-date {
            color: #888;
            font-size: 0.85rem;
            background: white;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .message-body {
            color: #555;
            line-height: 1.6;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2rem;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .analytics-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
        }

        .analytics-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .page-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .page-stat:last-child {
            border-bottom: none;
        }

        .page-name {
            color: #555;
            font-weight: 500;
        }

        .page-count {
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
        }

        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .refresh-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(102, 126, 234, 0.5);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .stat-card .number {
                font-size: 2rem;
            }

            .tabs {
                flex-direction: column;
            }

            .message-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Admin Dashboard</h1>
            <p>Manage your portfolio messages and analytics</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Messages</h3>
                <div class="number" id="totalMessages">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Visits</h3>
                <div class="number" id="totalVisits">-</div>
            </div>
            <div class="stat-card">
                <h3>Today's Visits</h3>
                <div class="number" id="todayVisits">-</div>
            </div>
            <div class="stat-card">
                <h3>Most Popular Page</h3>
                <div class="number" id="popularPage" style="font-size: 1.5rem;">-</div>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('messages')">
                📧 Contact Messages
            </div>
            <div class="tab" onclick="switchTab('analytics')">
                📊 Analytics
            </div>
        </div>

        <div id="messagesTab" class="tab-content active">
            <div class="messages-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Contact Messages</h2>
                    <button class="refresh-btn" onclick="loadMessages()">🔄 Refresh</button>
                </div>
                <div id="messagesContent">
                    <div class="loading">Loading messages...</div>
                </div>
            </div>
        </div>

        <div id="analyticsTab" class="tab-content">
            <div class="analytics-container">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Analytics Overview</h2>
                    <button class="refresh-btn" onclick="loadAnalytics()">🔄 Refresh</button>
                </div>
                <div id="analyticsContent">
                    <div class="loading">Loading analytics...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin + '/api';

        // Tab switching
        function switchTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            if (tabName === 'messages') {
                document.getElementById('messagesTab').classList.add('active');
                document.querySelectorAll('.tab')[0].classList.add('active');
            } else {
                document.getElementById('analyticsTab').classList.add('active');
                document.querySelectorAll('.tab')[1].classList.add('active');
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes} min ago`;
            if (hours < 24) return `${hours} hour${hours > 1 ? 's' : ''} ago`;
            if (days < 7) return `${days} day${days > 1 ? 's' : ''} ago`;
            
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Load contact messages
        async function loadMessages() {
            const container = document.getElementById('messagesContent');
            container.innerHTML = '<div class="loading">Loading messages...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/contacts`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const messages = await response.json();

                // Update stats
                document.getElementById('totalMessages').textContent = messages.length;

                if (messages.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            <h3>No messages yet</h3>
                            <p>Contact form submissions will appear here</p>
                        </div>
                    `;
                    return;
                }

                const messagesHTML = messages.map(msg => `
                    <div class="message-card">
                        <div class="message-header">
                            <div class="message-info">
                                <h3>${escapeHtml(msg.name)}</h3>
                                <div class="email">${escapeHtml(msg.email)}</div>
                            </div>
                            <div class="message-date">${formatDate(msg.created_at)}</div>
                        </div>
                        <div class="message-body">
                            ${escapeHtml(msg.message).replace(/\n/g, '<br>')}
                        </div>
                    </div>
                `).join('');

                container.innerHTML = messagesHTML;
            } catch (error) {
                console.error('Error loading messages:', error);
                container.innerHTML = `
                    <div class="error">
                        <strong>Error loading messages:</strong> ${error.message}
                        <br><br>
                        Make sure your backend is running and accessible.
                    </div>
                `;
            }
        }

        // Load analytics
        async function loadAnalytics() {
            const container = document.getElementById('analyticsContent');
            container.innerHTML = '<div class="loading">Loading analytics...</div>';

            try {
                const response = await fetch(`${API_BASE_URL}/analytics/stats`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const stats = await response.json();

                // Update header stats
                document.getElementById('totalVisits').textContent = stats.total_visits;
                document.getElementById('todayVisits').textContent = stats.today_visits;
                document.getElementById('popularPage').textContent = stats.most_popular_page.page || 'N/A';

                // Render analytics cards
                container.innerHTML = `
                    <div class="analytics-grid">
                        <div class="analytics-card">
                            <h3>📄 Visits by Page</h3>
                            ${stats.visits_by_page.map(page => `
                                <div class="page-stat">
                                    <span class="page-name">${page.page}</span>
                                    <span class="page-count">${page.count}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div class="analytics-card">
                            <h3>📈 Summary</h3>
                            <div class="page-stat">
                                <span class="page-name">Total Visits</span>
                                <span class="page-count">${stats.total_visits}</span>
                            </div>
                            <div class="page-stat">
                                <span class="page-name">Last 30 Days</span>
                                <span class="page-count">${stats.recent_visits}</span>
                            </div>
                            <div class="page-stat">
                                <span class="page-name">Today</span>
                                <span class="page-count">${stats.today_visits}</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading analytics:', error);
                container.innerHTML = `
                    <div class="error">
                        <strong>Error loading analytics:</strong> ${error.message}
                    </div>
                `;
            }
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load data on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            loadAnalytics();
        });

        // Auto-refresh every 30 seconds
        setInterval(() => {
            const activeTab = document.querySelector('.tab-content.active').id;
            if (activeTab === 'messagesTab') {
                loadMessages();
            } else {
                loadAnalytics();
            }
        }, 30000);
    </script>
</body>
</html>
